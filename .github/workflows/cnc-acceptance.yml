name: Fulton CNC exact acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  exact-algebra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Fulton source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fulton
          persist-credentials: false
      - name: Check out FP-owned Grease orchestration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/flexible-pipes
          ref: eaad087edc0bc5fcc1bc078c84708d153c3107d6
          path: flexible-pipes
          persist-credentials: false
      - name: Check out bounded CNC diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: the-twin-pines/singularity-free-Gcode
          ref: a4f77c904e3efd2ffffea3e334251ea793a8944f
          path: cnc
          persist-credentials: false
      - name: Check out independent acceptance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: fd10c66ed6b95bd8a7f3de7526ffc52e8efea1a4
          path: ai-ci
          persist-credentials: false
      - name: Acquire prebuilt algebra and exact compiled Grease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends macaulay2
          M2 --version
          gh api repos/dilapidated-shed/grease/actions/artifacts/11727693085/zip > "$RUNNER_TEMP/grease.zip"
          printf '%s  %s\n' 20c526c8bae5dc32a7b3d01a39eca5bdb7ee4c63fe540f34a07af7ba8b0d0039 "$RUNNER_TEMP/grease.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/grease.zip" '_bin/cxx-asan/ysh' -d "$RUNNER_TEMP/grease"
          chmod 755 "$RUNNER_TEMP/grease/_bin/cxx-asan/ysh"
          printf '%s  %s\n' 7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c "$RUNNER_TEMP/grease/_bin/cxx-asan/ysh" | sha256sum -c -
          mkdir "$RUNNER_TEMP/grease/bin"
          ln -s ../_bin/cxx-asan/ysh "$RUNNER_TEMP/grease/bin/oils-for-unix"
          printf '#!/bin/sh\nexec "%s" ysh "$@"\n' "$RUNNER_TEMP/grease/bin/oils-for-unix" > "$RUNNER_TEMP/grease/bin/grease"
          chmod 755 "$RUNNER_TEMP/grease/bin/grease"
      - name: Execute producers and independent acceptance through FP
        working-directory: flexible-pipes
        env:
          ASAN_OPTIONS: detect_leaks=0
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          test "$(git -C "$GITHUB_WORKSPACE/fulton" rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 scripts/run-pipeline fulton-cnc-02-earth \
            --param "grease=$RUNNER_TEMP/grease/bin/grease" \
            --param "m2=/usr/bin/M2" \
            --param "fulton=$GITHUB_WORKSPACE/fulton" \
            --param "cnc=$GITHUB_WORKSPACE/cnc" \
            --param "aici=$GITHUB_WORKSPACE/ai-ci" \
            --param "evidence=$RUNNER_TEMP/fulton-cnc-evidence" \
            --runs-root "$RUNNER_TEMP/fulton-cnc-runs"
      - name: Retain producer and oracle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fulton-cnc-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/fulton-cnc-evidence/
            ${{ runner.temp }}/fulton-cnc-runs/
          if-no-files-found: error
